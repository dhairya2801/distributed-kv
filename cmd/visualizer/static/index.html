<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSM-Tree Visualizer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --orange: #db6d28;
  --purple: #bc8cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  overflow-x: hidden;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 16px; font-weight: 600; }
.header h1 span { color: var(--accent); }
.header-controls { display: flex; gap: 10px; align-items: center; }
.toggle-btn {
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  transition: all 0.2s;
}
.toggle-btn:hover { border-color: var(--accent); }
.toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.controls {
  display: flex;
  gap: 8px;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
}
input[type="text"] {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  width: 140px;
}
input[type="text"]:focus { outline: none; border-color: var(--accent); }
.btn {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--accent); background: #1c2333; }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
.btn-primary:hover { background: #79b8ff; }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(248,81,73,0.1); }
.btn-green { border-color: var(--green); color: var(--green); }
.btn-green:hover { background: rgba(63,185,80,0.1); }
.separator { width: 1px; height: 24px; background: var(--border); }
.main-grid {
  display: grid;
  grid-template-columns: 280px 1fr 220px;
  grid-template-rows: 1fr 200px;
  gap: 0;
  height: calc(100vh - 92px);
}
.panel {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.panel:last-child { border-right: none; }
.panel-header {
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.panel-body::-webkit-scrollbar { width: 6px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
/* MemTable Panel */
.memtable-panel { grid-column: 1; grid-row: 1; }
.memtable-panel .panel-body { overflow-x: auto; overflow-y: hidden; cursor: pointer; }
.memtable-panel .panel-body::-webkit-scrollbar { height: 6px; }
.memtable-panel .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.skiplist-svg { min-width: 100%; width: auto; }
.expand-btn {
  cursor: pointer;
  color: var(--text-dim);
  font-size: 14px;
  background: none;
  border: none;
  padding: 0 4px;
  transition: color 0.2s;
}
.expand-btn:hover { color: var(--accent); }
/* Skip List expanded modal */
.modal.modal-wide { max-width: 90vw; width: auto; }
.modal.modal-wide .skiplist-modal-body { overflow-x: auto; padding: 12px 0; }
.sl-node {
  cursor: default;
  transition: opacity 0.3s;
}
.sl-node rect {
  rx: 4; ry: 4;
  stroke-width: 1.5;
}
.sl-node text { font-size: 10px; fill: var(--text); }
.sl-node.tombstone rect { stroke: var(--red); fill: rgba(248,81,73,0.15); }
.sl-node.tombstone text { text-decoration: line-through; fill: var(--red); }
.sl-node.normal rect { stroke: var(--accent); fill: rgba(88,166,255,0.1); }
.sl-node.highlight rect { stroke: var(--green); fill: rgba(63,185,80,0.25); }
.sl-link { stroke: var(--border); stroke-width: 1; fill: none; }
/* WAL Panel */
.wal-panel { grid-column: 1; grid-row: 2; }
.wal-entry {
  padding: 3px 6px;
  font-size: 11px;
  border-radius: 4px;
  margin-bottom: 2px;
  animation: fadeIn 0.3s;
}
.wal-entry.put { color: var(--green); background: rgba(63,185,80,0.08); }
.wal-entry.del { color: var(--red); background: rgba(248,81,73,0.08); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 4px rgba(88,166,255,0.3); }
  50% { box-shadow: 0 0 12px rgba(88,166,255,0.6); }
}
/* Disk Panel */
.disk-panel { grid-column: 2; grid-row: 1 / 3; }
.level-row {
  margin-bottom: 12px;
}
.level-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.sst-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.sst-card {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.2s;
  animation: scaleIn 0.3s;
  min-width: 120px;
}
.sst-card:hover {
  border-color: var(--accent);
  animation: pulseGlow 1.5s infinite;
}
.sst-card .filename { font-size: 12px; font-weight: 600; color: var(--accent); }
.sst-card .meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.sst-card.removing { animation: fadeOut 0.3s forwards; }
.flush-badge {
  display: inline-block;
  padding: 2px 8px;
  background: var(--yellow);
  color: #000;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  animation: pulseGlow 0.5s infinite;
}
.compact-badge {
  display: inline-block;
  padding: 2px 8px;
  background: var(--purple);
  color: #000;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  animation: pulseGlow 0.5s infinite;
}
/* Stats Panel */
.stats-panel { grid-column: 3; grid-row: 1 / 3; border-right: none; }
.stat-item {
  margin-bottom: 12px;
}
.stat-label {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.stat-value {
  font-size: 14px;
  font-weight: 600;
}
.progress-bar {
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s, background 0.3s;
}
/* Event Log */
.event-log { grid-column: 1 / 3; }
.event-log .panel-body { display: flex; flex-direction: column; }
.event-entry {
  padding: 2px 6px;
  font-size: 11px;
  border-radius: 3px;
  margin-bottom: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  animation: fadeIn 0.2s;
}
.event-entry .ts { color: var(--text-dim); margin-right: 6px; }
.event-entry.wal_write { color: var(--yellow); }
.event-entry.memtable_insert, .event-entry.memtable_delete { color: var(--green); }
.event-entry.flush_begin, .event-entry.flush_complete { color: var(--orange); }
.event-entry.compact_begin, .event-entry.compact_complete { color: var(--purple); }
.event-entry.get_begin, .event-entry.get_memtable, .event-entry.get_imm,
.event-entry.get_l0, .event-entry.get_l1, .event-entry.get_result { color: var(--accent); }
.event-entry.wal_reset { color: var(--text-dim); }
/* Search animation */
.search-indicator {
  position: fixed;
  padding: 4px 10px;
  background: var(--accent);
  color: #000;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  pointer-events: none;
  z-index: 100;
  display: none;
}
/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  max-width: 700px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 { font-size: 14px; margin-bottom: 12px; color: var(--accent); }
.modal table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.modal th { font-size: 10px; text-transform: uppercase; color: var(--text-dim); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
.modal td { font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
.modal .footer-diagram {
  font-size: 12px;
  padding: 10px;
  background: var(--bg);
  border-radius: 6px;
  text-align: center;
  color: var(--text-dim);
}
.modal .footer-diagram span { color: var(--accent); font-weight: 600; }
.modal-close {
  float: right;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 18px;
}
.modal-close:hover { color: var(--text); }
.connection-status {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.connection-status.connected { background: var(--green); }
.connection-status.disconnected { background: var(--red); }
/* Notification toast */
.notification {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--accent);
  font-size: 12px;
  z-index: 300;
  animation: fadeIn 0.2s;
}
</style>
</head>
<body>

<div class="header">
  <h1><span>LSM-Tree</span> Visualizer</h1>
  <div class="header-controls">
    <span class="connection-status disconnected" id="connStatus" title="WebSocket"></span>
    <button class="toggle-btn" id="slowModeBtn" onclick="toggleSlowMode()">Slow Mode: OFF</button>
    <button class="btn btn-danger" onclick="resetTree()">Reset</button>
  </div>
</div>

<div class="controls">
  <input type="text" id="keyInput" placeholder="Key" />
  <input type="text" id="valueInput" placeholder="Value" />
  <button class="btn btn-primary" onclick="doPut()">Put</button>
  <button class="btn btn-danger" onclick="doDelete()">Delete</button>
  <button class="btn btn-green" onclick="doGet()">Get</button>
  <div class="separator"></div>
  <button class="btn" onclick="doBulk()">Bulk Insert 20</button>
  <button class="btn" onclick="doFlush()">Force Flush</button>
</div>

<div class="main-grid">
  <!-- MemTable Panel -->
  <div class="panel memtable-panel">
    <div class="panel-header">
      <span>MemTable (Skip List)</span>
      <span><span id="memBadge"></span><button class="expand-btn" onclick="openSkipListModal()" title="Expand">&#x26F6;</button></span>
    </div>
    <div class="panel-body" id="memtableBody" onclick="openSkipListModal()" title="Click to expand">
      <svg id="skiplistSvg" class="skiplist-svg"></svg>
    </div>
  </div>

  <!-- WAL Panel -->
  <div class="panel wal-panel">
    <div class="panel-header">
      <span>WAL</span>
      <span id="walCount">0 entries</span>
    </div>
    <div class="panel-body" id="walBody"></div>
  </div>

  <!-- Disk Levels Panel -->
  <div class="panel disk-panel">
    <div class="panel-header">
      <span>Disk Levels</span>
      <span id="diskBadge"></span>
    </div>
    <div class="panel-body" id="diskBody">
      <div class="level-row">
        <div class="level-label">L0 — Recent Flushes</div>
        <div class="sst-cards" id="l0Cards"></div>
      </div>
      <div class="level-row">
        <div class="level-label">L1 — Compacted</div>
        <div class="sst-cards" id="l1Cards"></div>
      </div>
    </div>
  </div>

  <!-- Stats Panel -->
  <div class="panel stats-panel">
    <div class="panel-header"><span>Stats</span></div>
    <div class="panel-body" id="statsBody">
      <div class="stat-item">
        <div class="stat-label">MemTable Size</div>
        <div class="stat-value" id="statMemSize">0 B / 512 B</div>
        <div class="progress-bar"><div class="progress-fill" id="memProgress" style="width:0%; background:var(--green)"></div></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">MemTable Entries</div>
        <div class="stat-value" id="statMemEntries">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">L0 SSTables</div>
        <div class="stat-value" id="statL0">0 / 4</div>
        <div class="progress-bar"><div class="progress-fill" id="l0Progress" style="width:0%; background:var(--green)"></div></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">L1 SSTables</div>
        <div class="stat-value" id="statL1">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">WAL Entries</div>
        <div class="stat-value" id="statWAL">0</div>
      </div>
    </div>
  </div>
</div>

<!-- Event Log - fixed at bottom -->
<div style="height:160px; border-top:1px solid var(--border); display:flex; flex-direction:column;">
  <div class="panel-header">
    <span>Event Log</span>
    <button class="btn" style="padding:2px 8px;font-size:10px;" onclick="clearEventLog()">Clear</button>
  </div>
  <div class="panel-body" id="eventLog" style="flex:1;overflow-y:auto;"></div>
</div>

<!-- SSTable Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle">SSTable Detail</h2>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ──────────────────────────────────────────
//  State
// ──────────────────────────────────────────
let ws = null;
let slowMode = false;
let eventQueue = [];
let processing = false;
let walEntries = [];
let lastSnapshot = null;
let searchHighlightKey = null;

// ──────────────────────────────────────────
//  WebSocket
// ──────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('connStatus').classList.remove('disconnected');
    document.getElementById('connStatus').classList.add('connected');
    refreshSnapshot();
  };
  ws.onclose = () => {
    document.getElementById('connStatus').classList.remove('connected');
    document.getElementById('connStatus').classList.add('disconnected');
    setTimeout(connectWS, 2000);
  };
  ws.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    if (slowMode) {
      eventQueue.push(event);
      processQueue();
    } else {
      handleEvent(event);
    }
  };
}

// ──────────────────────────────────────────
//  Slow Mode
// ──────────────────────────────────────────
function toggleSlowMode() {
  slowMode = !slowMode;
  const btn = document.getElementById('slowModeBtn');
  btn.textContent = `Slow Mode: ${slowMode ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active', slowMode);
  if (!slowMode && eventQueue.length > 0) {
    // Drain queue immediately
    eventQueue.forEach(e => handleEvent(e));
    eventQueue = [];
  }
}

async function processQueue() {
  if (processing || eventQueue.length === 0) return;
  processing = true;
  while (eventQueue.length > 0) {
    const event = eventQueue.shift();
    handleEvent(event);
    await new Promise(r => setTimeout(r, 400));
  }
  processing = false;
}

// ──────────────────────────────────────────
//  Event Handling
// ──────────────────────────────────────────
function handleEvent(event) {
  addEventLogEntry(event);
  updateStats(event.stats);

  switch (event.type) {
    case 'wal_write':
      addWALEntry(event);
      break;
    case 'memtable_insert':
    case 'memtable_delete':
      // Incrementally update the local snapshot so the skiplist renders
      // one node at a time (especially important for slow mode).
      addNodeToLocalSnapshot(event);
      if (lastSnapshot) renderSkipList(lastSnapshot.memTable);
      break;
    case 'flush_begin':
      document.getElementById('memBadge').innerHTML = '<span class="flush-badge">FLUSHING</span>';
      break;
    case 'flush_complete':
      document.getElementById('memBadge').innerHTML = '';
      refreshSnapshot();
      break;
    case 'compact_begin':
      document.getElementById('diskBadge').innerHTML = '<span class="compact-badge">COMPACTING</span>';
      break;
    case 'compact_complete':
      document.getElementById('diskBadge').innerHTML = '';
      refreshSnapshot();
      break;
    case 'wal_reset':
      clearWAL();
      // MemTable was rotated — clear local memtable nodes since it's now empty.
      if (lastSnapshot) {
        lastSnapshot.memTable = { entries: [], nodes: [], level: 1 };
        renderSkipList(lastSnapshot.memTable);
      }
      break;
    case 'get_begin':
      searchHighlightKey = event.key;
      break;
    case 'get_memtable':
      flashPanel('.memtable-panel', event.found);
      break;
    case 'get_imm':
      // flash indicator
      break;
    case 'get_l0':
    case 'get_l1':
      if (event.found) flashSSTCard(event.sstPath, true);
      break;
    case 'get_result':
      searchHighlightKey = null;
      break;
  }
}

// Incrementally add/update a node in the local snapshot from event data.
// This avoids fetching a full snapshot on every insert, enabling true
// one-by-one rendering in slow mode.
function addNodeToLocalSnapshot(event) {
  if (!lastSnapshot) {
    lastSnapshot = { memTable: { entries: [], nodes: [], level: 1 }, levels: [[], []], stats: {} };
  }
  const mt = lastSnapshot.memTable;
  // Guard against Go nil slices which serialize as JSON null.
  if (!mt.nodes) mt.nodes = [];
  if (!mt.entries) mt.entries = [];
  if (!mt.level) mt.level = 1;
  const key = event.key;
  const value = event.value || '';
  const deleted = event.type === 'memtable_delete';

  // Update or insert in entries array (sorted by key).
  let entryIdx = mt.entries.findIndex(e => e.key === key);
  if (entryIdx >= 0) {
    mt.entries[entryIdx] = { key, value, deleted };
  } else {
    // Insert in sorted position.
    let pos = mt.entries.findIndex(e => e.key > key);
    if (pos < 0) pos = mt.entries.length;
    mt.entries.splice(pos, 0, { key, value, deleted });
  }

  // Update or insert in nodes array (sorted by key).
  let nodeIdx = mt.nodes.findIndex(n => n.key === key);
  if (nodeIdx >= 0) {
    mt.nodes[nodeIdx].value = value;
    mt.nodes[nodeIdx].deleted = deleted;
  } else {
    // Random level for the skip list node (1-based, geometric distribution).
    let level = 1;
    while (Math.random() < 0.5 && level < 12) level++;
    let pos = mt.nodes.findIndex(n => n.key > key);
    if (pos < 0) pos = mt.nodes.length;
    mt.nodes.splice(pos, 0, { key, value, deleted, level });
    // Update max level.
    if (level > mt.level) mt.level = level;
  }
}

// ──────────────────────────────────────────
//  API Calls
// ──────────────────────────────────────────
async function doPut() {
  const key = document.getElementById('keyInput').value.trim();
  const value = document.getElementById('valueInput').value.trim();
  if (!key) return;
  await fetch('/api/put', { method: 'POST', body: JSON.stringify({ key, value }) });
}

async function doDelete() {
  const key = document.getElementById('keyInput').value.trim();
  if (!key) return;
  await fetch('/api/delete', { method: 'POST', body: JSON.stringify({ key }) });
}

async function doGet() {
  const key = document.getElementById('keyInput').value.trim();
  if (!key) return;
  const resp = await fetch('/api/get', { method: 'POST', body: JSON.stringify({ key }) });
  const data = await resp.json();
  if (data.found) {
    document.getElementById('valueInput').value = data.value;
    flashResult(true);
  } else {
    document.getElementById('valueInput').value = '';
    flashResult(false);
  }
}

async function doBulk() {
  const resp = await fetch('/api/bulk', { method: 'POST', body: JSON.stringify({ count: 20, prefix: 'key' }) });
  const data = await resp.json();
  if (data.from !== undefined) showNotification(`Inserted key${String(data.from).padStart(4,'0')} — key${String(data.to).padStart(4,'0')}`);
}

async function doFlush() {
  await fetch('/api/flush', { method: 'POST' });
}

async function resetTree() {
  walEntries = [];
  document.getElementById('walBody').innerHTML = '';
  await fetch('/api/reset', { method: 'POST' });
  refreshSnapshot();
}

// ──────────────────────────────────────────
//  Snapshot
// ──────────────────────────────────────────
let snapshotPending = false;
function refreshSnapshot() {
  if (snapshotPending) return;
  snapshotPending = true;
  requestAnimationFrame(async () => {
    try {
      const resp = await fetch('/api/snapshot');
      const snap = await resp.json();
      lastSnapshot = snap;
      renderSkipList(snap.memTable);
      renderDiskLevels(snap.levels);
      updateStats(snap.stats);
    } catch (e) { /* ignore */ }
    snapshotPending = false;
  });
}

// ──────────────────────────────────────────
//  Skip List Visualization (D3)
// ──────────────────────────────────────────
function renderSkipList(memTable) {
  const svg = d3.select('#skiplistSvg');
  const container = document.getElementById('memtableBody');
  const width = container.clientWidth - 16;
  const nodes = memTable.nodes || [];
  const maxLevel = memTable.level || 1;

  const nodeW = 70, nodeH = 22, levelGap = 28, colGap = 12;
  const padLeft = 40, padTop = 20;
  const height = Math.max(100, padTop + maxLevel * levelGap + 30);
  const svgWidth = Math.max(width, padLeft + nodes.length * (nodeW + colGap) + 20);

  svg.attr('width', svgWidth).attr('height', height);
  svg.selectAll('*').remove();

  // Level labels
  for (let l = 0; l < maxLevel; l++) {
    svg.append('text')
      .attr('x', 4)
      .attr('y', padTop + (maxLevel - 1 - l) * levelGap + nodeH / 2 + 4)
      .attr('fill', 'var(--text-dim)')
      .attr('font-size', '9px')
      .text(`L${l}`);
  }

  // Draw nodes
  const groups = svg.selectAll('.sl-node')
    .data(nodes, d => d.key)
    .enter()
    .append('g')
    .attr('class', d => `sl-node ${d.deleted ? 'tombstone' : (d.key === searchHighlightKey ? 'highlight' : 'normal')}`);

  nodes.forEach((node, i) => {
    const x = padLeft + i * (nodeW + colGap);
    const nodeLevel = node.level || 1;

    // Draw at each level the node participates in
    for (let l = 0; l < nodeLevel && l < maxLevel; l++) {
      const y = padTop + (maxLevel - 1 - l) * levelGap;

      svg.append('rect')
        .attr('x', x).attr('y', y)
        .attr('width', nodeW).attr('height', nodeH)
        .attr('rx', 4).attr('ry', 4)
        .attr('fill', node.deleted ? 'rgba(248,81,73,0.15)' : 'rgba(88,166,255,0.1)')
        .attr('stroke', node.deleted ? 'var(--red)' : 'var(--accent)')
        .attr('stroke-width', 1.5);

      // Only show text on bottom level
      if (l === 0) {
        const label = node.deleted ? `${node.key} [DEL]` : `${node.key}`;
        svg.append('text')
          .attr('x', x + nodeW / 2).attr('y', y + nodeH / 2 + 4)
          .attr('text-anchor', 'middle')
          .attr('fill', node.deleted ? 'var(--red)' : 'var(--text)')
          .attr('font-size', '10px')
          .text(label.length > 10 ? label.slice(0, 9) + '…' : label);
      }

      // Forward pointer arrow at this level
      if (i < nodes.length - 1) {
        // Find next node that has this level
        let nextIdx = -1;
        for (let j = i + 1; j < nodes.length; j++) {
          if ((nodes[j].level || 1) > l) { nextIdx = j; break; }
        }
        if (nextIdx >= 0) {
          const nx = padLeft + nextIdx * (nodeW + colGap);
          svg.append('line')
            .attr('x1', x + nodeW).attr('y1', y + nodeH / 2)
            .attr('x2', nx).attr('y2', y + nodeH / 2)
            .attr('stroke', 'var(--border)')
            .attr('stroke-width', 1)
            .attr('marker-end', 'url(#arrowhead)');
        }
      }
    }
  });

  // Arrowhead marker
  svg.append('defs').append('marker')
    .attr('id', 'arrowhead')
    .attr('viewBox', '0 0 10 7')
    .attr('refX', 10).attr('refY', 3.5)
    .attr('markerWidth', 6).attr('markerHeight', 5)
    .attr('orient', 'auto')
    .append('polygon')
    .attr('points', '0 0, 10 3.5, 0 7')
    .attr('fill', 'var(--border)');
}

// ──────────────────────────────────────────
//  WAL Panel
// ──────────────────────────────────────────
function addWALEntry(event) {
  const body = document.getElementById('walBody');
  const div = document.createElement('div');
  const isDel = event.deleted;
  div.className = `wal-entry ${isDel ? 'del' : 'put'}`;
  div.textContent = isDel ? `[DEL] ${event.key}` : `[PUT] ${event.key}=${event.value}`;
  body.insertBefore(div, body.firstChild);
  // Keep max 200 entries
  while (body.children.length > 200) body.removeChild(body.lastChild);
  document.getElementById('walCount').textContent = `${body.children.length} entries`;
}

function clearWAL() {
  const body = document.getElementById('walBody');
  // Fade out animation
  Array.from(body.children).forEach(el => {
    el.style.animation = 'fadeOut 0.3s forwards';
  });
  setTimeout(() => {
    body.innerHTML = '';
    document.getElementById('walCount').textContent = '0 entries';
  }, 300);
}

// ──────────────────────────────────────────
//  Disk Levels
// ──────────────────────────────────────────
function renderDiskLevels(levels) {
  if (!levels) return;

  for (let lvl = 0; lvl < 2; lvl++) {
    const containerId = lvl === 0 ? 'l0Cards' : 'l1Cards';
    const container = document.getElementById(containerId);
    const tables = (levels[lvl] || []);

    // Build new HTML
    container.innerHTML = '';
    tables.forEach(sst => {
      const card = document.createElement('div');
      card.className = 'sst-card';
      card.onclick = () => openSSTableModal(sst.path);
      card.dataset.path = sst.path;
      card.innerHTML = `
        <div class="filename">${sst.filename}</div>
        <div class="meta">${formatBytes(sst.dataSize)} &middot; ${(sst.indexEntries || []).length} idx</div>
      `;
      container.appendChild(card);
    });
  }
}

function flashSSTCard(path, found) {
  const card = document.querySelector(`.sst-card[data-path="${path}"]`);
  if (!card) return;
  card.style.borderColor = found ? 'var(--green)' : 'var(--border)';
  card.style.boxShadow = found ? '0 0 8px rgba(63,185,80,0.4)' : 'none';
  setTimeout(() => {
    card.style.borderColor = '';
    card.style.boxShadow = '';
  }, 800);
}

// ──────────────────────────────────────────
//  Stats
// ──────────────────────────────────────────
function updateStats(stats) {
  if (!stats) return;
  const memPct = stats.memTableCapacity > 0 ? (stats.memTableSize / stats.memTableCapacity * 100) : 0;
  const l0Pct = stats.l0Threshold > 0 ? (stats.l0Count / stats.l0Threshold * 100) : 0;

  document.getElementById('statMemSize').textContent = `${formatBytes(stats.memTableSize)} / ${formatBytes(stats.memTableCapacity)}`;
  document.getElementById('statMemEntries').textContent = stats.memTableEntries;
  document.getElementById('statL0').textContent = `${stats.l0Count} / ${stats.l0Threshold}`;
  document.getElementById('statL1').textContent = stats.l1Count;
  document.getElementById('statWAL').textContent = stats.walEntries;

  const memBar = document.getElementById('memProgress');
  memBar.style.width = `${Math.min(100, memPct)}%`;
  memBar.style.background = memPct > 80 ? 'var(--red)' : memPct > 50 ? 'var(--yellow)' : 'var(--green)';

  const l0Bar = document.getElementById('l0Progress');
  l0Bar.style.width = `${Math.min(100, l0Pct)}%`;
  l0Bar.style.background = l0Pct >= 100 ? 'var(--red)' : l0Pct > 50 ? 'var(--yellow)' : 'var(--green)';
}

// ──────────────────────────────────────────
//  Event Log
// ──────────────────────────────────────────
const eventDescriptions = {
  'wal_write': e => e.deleted ? `WAL ← DEL ${e.key}` : `WAL ← PUT ${e.key}=${e.value}`,
  'memtable_insert': e => `MemTable ← ${e.key}=${e.value}`,
  'memtable_delete': e => `MemTable ← DEL ${e.key}`,
  'flush_begin': () => 'Flush started: MemTable → SSTable',
  'flush_complete': e => `Flush complete → ${e.sstPath ? e.sstPath.split('/').pop() : 'L0'}`,
  'compact_begin': () => 'Compaction started: L0 → L1',
  'compact_complete': e => `Compaction complete → ${e.sstPath ? e.sstPath.split('/').pop() : 'L1'}`,
  'get_begin': e => `GET "${e.key}" — searching...`,
  'get_memtable': e => `  MemTable: ${e.found ? 'FOUND' : 'miss'}`,
  'get_imm': e => `  Imm MemTable: ${e.found ? 'FOUND' : 'miss'}`,
  'get_l0': e => `  L0 ${e.sstPath ? e.sstPath.split('/').pop() : ''}: ${e.found ? 'FOUND' : 'miss'}`,
  'get_l1': e => `  L1 ${e.sstPath ? e.sstPath.split('/').pop() : ''}: ${e.found ? 'FOUND' : 'miss'}`,
  'get_result': e => e.found ? `  → FOUND: ${e.key}=${e.value}` : `  → NOT FOUND${e.deleted ? ' (tombstone)' : ''}`,
  'wal_reset': () => 'WAL reset (cleared)',
};

function addEventLogEntry(event) {
  const log = document.getElementById('eventLog');
  const div = document.createElement('div');
  div.className = `event-entry ${event.type}`;
  const ts = new Date().toLocaleTimeString('en', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const desc = (eventDescriptions[event.type] || (() => event.type))(event);
  div.innerHTML = `<span class="ts">${ts}</span>${escapeHtml(desc)}`;
  log.insertBefore(div, log.firstChild);
  // Keep max 500 entries
  while (log.children.length > 500) log.removeChild(log.lastChild);
}

function clearEventLog() {
  document.getElementById('eventLog').innerHTML = '';
}

// ──────────────────────────────────────────
//  SSTable Modal
// ──────────────────────────────────────────
async function openSSTableModal(path) {
  const resp = await fetch(`/api/sstable?path=${encodeURIComponent(path)}`);
  const data = await resp.json();
  const filename = path.split('/').pop();

  document.getElementById('modalTitle').textContent = `SSTable: ${filename}`;

  let html = '';

  // Footer diagram
  const indexOffset = data.dataSize;
  html += `<div class="footer-diagram" style="margin-bottom:16px;">
    <span>[Data Section: 0 → ${indexOffset}B]</span> |
    <span>[Index Block: ${indexOffset}B → ...]</span> |
    <span>[Footer: 16B]</span>
  </div>`;

  // Sparse Index
  html += '<h2 style="font-size:12px;margin:8px 0;">Sparse Index</h2>';
  html += '<table><tr><th>Key</th><th>Byte Offset</th></tr>';
  (data.index || []).forEach(ie => {
    html += `<tr><td>${escapeHtml(ie.key)}</td><td>${ie.offset}</td></tr>`;
  });
  html += '</table>';

  // Data Entries
  html += '<h2 style="font-size:12px;margin:8px 0;">Data Entries</h2>';
  html += '<table><tr><th>Op</th><th>Key</th><th>Value</th></tr>';
  (data.entries || []).forEach(e => {
    const op = e.deleted ? '<span style="color:var(--red)">DEL</span>' : '<span style="color:var(--green)">PUT</span>';
    html += `<tr><td>${op}</td><td>${escapeHtml(e.key)}</td><td>${e.deleted ? '—' : escapeHtml(e.value)}</td></tr>`;
  });
  html += '</table>';

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('active');
  document.querySelector('#modalOverlay .modal').classList.remove('modal-wide');
}

function openSkipListModal() {
  if (!lastSnapshot || !lastSnapshot.memTable) return;
  const modal = document.querySelector('#modalOverlay .modal');
  modal.classList.add('modal-wide');
  document.getElementById('modalTitle').textContent = 'MemTable — Skip List (Full View)';

  const memTable = lastSnapshot.memTable;
  const nodes = memTable.nodes || [];
  const maxLevel = memTable.level || 1;
  const nodeW = 70, nodeH = 22, levelGap = 28, colGap = 12;
  const padLeft = 40, padTop = 20;
  const height = Math.max(100, padTop + maxLevel * levelGap + 30);
  const svgWidth = Math.max(600, padLeft + nodes.length * (nodeW + colGap) + 20);

  document.getElementById('modalContent').innerHTML =
    `<div class="skiplist-modal-body"><svg width="${svgWidth}" height="${height}" id="skiplistModalSvg"></svg></div>`;
  document.getElementById('modalOverlay').classList.add('active');

  const svg = d3.select('#skiplistModalSvg');
  svg.append('defs').append('marker')
    .attr('id', 'arrowhead-modal')
    .attr('viewBox', '0 0 10 7')
    .attr('refX', 10).attr('refY', 3.5)
    .attr('markerWidth', 6).attr('markerHeight', 5)
    .attr('orient', 'auto')
    .append('polygon')
    .attr('points', '0 0, 10 3.5, 0 7')
    .attr('fill', 'var(--border)');

  for (let l = 0; l < maxLevel; l++) {
    svg.append('text')
      .attr('x', 4)
      .attr('y', padTop + (maxLevel - 1 - l) * levelGap + nodeH / 2 + 4)
      .attr('fill', 'var(--text-dim)')
      .attr('font-size', '9px')
      .text('L' + l);
  }

  nodes.forEach((node, i) => {
    const x = padLeft + i * (nodeW + colGap);
    const nodeLevel = node.level || 1;
    for (let l = 0; l < nodeLevel && l < maxLevel; l++) {
      const y = padTop + (maxLevel - 1 - l) * levelGap;
      svg.append('rect')
        .attr('x', x).attr('y', y)
        .attr('width', nodeW).attr('height', nodeH)
        .attr('rx', 4).attr('ry', 4)
        .attr('fill', node.deleted ? 'rgba(248,81,73,0.15)' : 'rgba(88,166,255,0.1)')
        .attr('stroke', node.deleted ? 'var(--red)' : 'var(--accent)')
        .attr('stroke-width', 1.5);
      if (l === 0) {
        const label = node.deleted ? node.key + ' [DEL]' : node.key;
        svg.append('text')
          .attr('x', x + nodeW / 2).attr('y', y + nodeH / 2 + 4)
          .attr('text-anchor', 'middle')
          .attr('fill', node.deleted ? 'var(--red)' : 'var(--text)')
          .attr('font-size', '10px')
          .text(label.length > 10 ? label.slice(0, 9) + '\u2026' : label);
      }
      if (i < nodes.length - 1) {
        let nextIdx = -1;
        for (let j = i + 1; j < nodes.length; j++) {
          if ((nodes[j].level || 1) > l) { nextIdx = j; break; }
        }
        if (nextIdx >= 0) {
          const nx = padLeft + nextIdx * (nodeW + colGap);
          svg.append('line')
            .attr('x1', x + nodeW).attr('y1', y + nodeH / 2)
            .attr('x2', nx).attr('y2', y + nodeH / 2)
            .attr('stroke', 'var(--border)')
            .attr('stroke-width', 1)
            .attr('marker-end', 'url(#arrowhead-modal)');
        }
      }
    }
  });
}

// ──────────────────────────────────────────
//  Flash Animations
// ──────────────────────────────────────────
function flashPanel(selector, found) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.style.boxShadow = found ? '0 0 12px rgba(63,185,80,0.3) inset' : '0 0 12px rgba(139,148,158,0.15) inset';
  setTimeout(() => { el.style.boxShadow = ''; }, 600);
}

function flashResult(found) {
  const el = document.getElementById('valueInput');
  el.style.borderColor = found ? 'var(--green)' : 'var(--red)';
  el.style.boxShadow = found ? '0 0 8px rgba(63,185,80,0.4)' : '0 0 8px rgba(248,81,73,0.4)';
  setTimeout(() => {
    el.style.borderColor = '';
    el.style.boxShadow = '';
  }, 1000);
}

// ──────────────────────────────────────────
//  Utilities
// ──────────────────────────────────────────
function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function showNotification(msg) {
  const el = document.createElement('div');
  el.className = 'notification';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.animation = 'fadeOut 0.3s forwards'; setTimeout(() => el.remove(), 300); }, 2000);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.activeElement.id === 'valueInput') doPut();
  if (e.key === 'Enter' && document.activeElement.id === 'keyInput') {
    if (document.getElementById('valueInput').value) doPut();
    else doGet();
  }
});

// ──────────────────────────────────────────
//  Init
// ──────────────────────────────────────────
connectWS();
</script>
